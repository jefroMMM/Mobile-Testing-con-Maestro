name: Android y Maestro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'evidencias/**', '*.md', 'output/pdf/**']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, lint and record versions
        run: |
          mkdir -p evidencias/ci/build output/apk
          chmod +x gradlew scripts/ci-tests.sh
          ./gradlew --no-daemon --console=plain assembleDebug lintDebug 2>&1 | tee evidencias/ci/build/gradle.log
          cp app/build/outputs/apk/debug/app-debug.apk output/apk/taskflow-debug.apk
          sha256sum output/apk/taskflow-debug.apk > evidencias/ci/build/apk-sha256.txt
          java -version 2> evidencias/ci/java.txt
          ./gradlew --version > evidencias/ci/gradle-version.txt
      - name: Install pinned Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip -o /tmp/maestro.zip
          echo 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  /tmp/maestro.zip' | sha256sum --check
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute each flow and the complete suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: bash scripts/ci-tests.sh
      - name: Upload authentic execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-delivery
          path: |
            evidencias/ci/
            output/apk/
            app/build/reports/lint-results-debug.html
          retention-days: 30

